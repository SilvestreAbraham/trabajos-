<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficas en Tiempo Real</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0f33, #1b1b2f);
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 30px; 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .navbar button {
            background: #ffcc00;
            border: none;
            color: #1b1b2f;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, background 0.3s;
            margin: 0 15px;
        }
        .navbar button:hover {
            background: #abf304;
            transform: scale(1.1);
        }
        .container {
            margin-top: 90px;
            background-color: rgba(55, 70, 94, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(165, 55, 209, 0.2);
            text-align: center;
            width: 80%;
        }
        h1 {
            font-size: 2rem;
            text-shadow: 0 0 10px #f13a11;
            color: #ffcc00;
        }
        canvas {
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button onclick="showGraph('weather')">Temperatura</button>
        <button onclick="showGraph('accidents')">Accidentes</button>
    </div>

    <div class="container">
        <h1 id="graph-title">SKYNET - Temperatura en Tiempo Real</h1>
        <canvas id="weatherChart"></canvas>
        <canvas id="accidentChart" style="display: none;"></canvas>
    </div>

    <script src="script.js"></script>

</body>
</html>
